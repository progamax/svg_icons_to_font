name: svg_icons_to_font
description: A pure Dart package and CLI tool that converts a folder of SVG icons into an OpenType (.otf) font file and generates a corresponding Flutter IconData Dart class.
version: 0.1.0
environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.4.2
  path: ^1.9.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0

executables:
  svg_icons_to_font: svg_icons_to_font
